services:
  nginx:
    image: nginx:1.27.3-alpine
    container_name: lb-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - public_net
      - internal_net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx_status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build: ./app
    restart: unless-stopped
    environment:
      - DB_HOST=rag-db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-ragdb}
      - DB_USER=${DB_USER:-raguser}
      - DB_PASSWORD=${DB_PASSWORD}
      - AI_LB_URL=http://nginx:11435
      - LLM_MODEL=${LLM_MODEL:-llama3.2:1b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
    networks:
      - internal_net
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

