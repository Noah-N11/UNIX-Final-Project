events {
    worker_connections 1024;
}

http{
    # docker dns so scaled web containers get pickeed up
    resolver 127.0.0.11 valid=5s ipv6=off;

    # limits AI endpoint to 2 req/s per IP
    limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=2r/s;
    limit_req_status 429;

    upstream ollama_nodes {
        server ollama-1:1134 max_fails=2 fail_timeout=10s;
        server ollama-2:1134 max_fails=2 fail_timeout=10s;
    }

    server{
        listen 80;

        location /api/ask {
            limit_req zone=ai_zone burst=3 nodelay;

            set $web_backend http://web:500;
            proxy_pass $web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            chunked_transfer_encoding on;
        }

        location / {
            set $web_backend http://web:5000;
            proxy_pass $web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # internal status page for autoscaling.sh
        location /nginx_status{
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12
            deny all;
        }
    }

    # internal LB for ollama replicas
    server{
        listen 11435;

        location / {
            proxy_pass http://ollama_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_next_upstream error timeout http_502 http_504;
            proxy_next_upstream_tries 2;

            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
    }
}